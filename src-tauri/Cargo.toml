[package]
name = "claude-accounts"
version = "1.0.0"
description = "Run multiple Claude accounts side by side — isolated and always logged in."
authors = ["you"]
edition = "2021"
default-run = "claude-accounts"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
